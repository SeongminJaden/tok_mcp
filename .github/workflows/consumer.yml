name: Verify npm consumer
on: [push, pull_request]
jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install the tarball and run the starter
        run: |
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/consumer"
          cp examples/starter.mjs "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm install "$RUNNER_TEMP/$tarball"
          node starter.mjs docs
          test -s docs/ARCHITECTURE.md
          test -s docs/.ai-context.yaml

  starters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify five upstream scaffolds with the packed candidate
        working-directory: examples/starter-integrations
        env:
          CI: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          archive=$(cd ../.. && npm pack --silent --pack-destination "$RUNNER_TEMP")
          npm install --no-save "$RUNNER_TEMP/$archive"
          node t3/create.mjs team-board 500 150
          npx --yes @nestjs/cli@12.0.15 new nest-api --skip-install --skip-git --package-manager npm --language ts
          npx --yes create-fastify@5.0.0 fastify-api
          npx --yes express-generator@4.16.1 express-api --no-view
          npx --yes create-next-app@16.4.6 next-web --yes --ts --app --no-tailwind --skip-install --disable-git --use-npm
          node run.mjs nest nest-api 500 150
          node run.mjs fastify fastify-api 500 150
          node run.mjs express express-api 500 150
          node run.mjs next next-web 500 150
          node verify.mjs .
